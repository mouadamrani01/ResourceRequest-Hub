services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: resource_request_hub
      DB_USER: resource_app
      DB_PASSWORD: local_dev_only
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_only
      MYSQL_DATABASE: resource_request_hub
      MYSQL_USER: resource_app
      MYSQL_PASSWORD: local_dev_only
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
